# Render Blueprint — BioBoock API
#
# Deploy: no dashboard da Render, "New" -> "Blueprint" -> conectar este
# repositório. A Render lê este arquivo e provisiona o serviço web (Docker,
# a partir de apps/api/Dockerfile) e o banco Postgres automaticamente.
#
# IMPORTANTE (custo): confirme o `plan` de cada recurso abaixo no dashboard
# da Render antes de confirmar o deploy — os nomes de plano/preço mudam com
# frequência e a Render pode exigir um plano pago para o Postgres dependendo
# da oferta vigente. Nada aqui é cobrado automaticamente sem sua confirmação
# explícita no fluxo de criação do Blueprint.
#
# CORS_ORIGIN abaixo deve ser atualizado para o domínio real do Web na
# Vercel (ver apps/web, projeto "web") — nunca deixar "*" em produção com
# um domínio de frontend conhecido.

databases:
  - name: bioboock-db
    plan: free # confirmar no dashboard; ajustar se a Render não oferecer Postgres free no momento do deploy

services:
  - type: web
    name: bioboock-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free # confirmar no dashboard
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bioboock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://web-renatoprestes76s-projects.vercel.app
